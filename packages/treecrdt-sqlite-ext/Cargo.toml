[package]
name = "treecrdt-sqlite-ext"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "SQLite / wa-sqlite extension harness for TreeCRDT."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
blake3 = "1.6"
treecrdt-core = { path = "../treecrdt-core" }
# bindgen 0.60 in the published crate emits opaque API tables with Clang 22.
# Return to crates.io when https://github.com/asg017/sqlite-loadable-rs/pull/34 is released.
sqlite3ext-sys = { git = "https://github.com/marcus-pousette/sqlite-loadable-rs", rev = "e785419dddb0b44eb6e2a98d0d8f6697fd3092ee", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }
serde_json = { version = "1.0", optional = true }
ciborium = { version = "0.2.2", optional = true }

[features]
default = []
# Native loadable extension using sqlite3ext API table.
ext-sqlite = ["dep:sqlite3ext-sys", "dep:serde", "dep:serde_bytes", "dep:serde_json", "dep:ciborium"]
# Static-link extension for wasm/emscripten builds (no bundled SQLite C).
static-link = ["dep:serde", "dep:serde_bytes", "dep:serde_json", "dep:ciborium"]
wasm-ext = ["static-link"]

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }
treecrdt-test-support = { path = "../treecrdt-test-support" }
